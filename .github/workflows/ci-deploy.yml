name: Validate & Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Syntax & Asset Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check experts.js
          node --check app.js

      - name: Check Python launcher syntax & DOM/asset integrity
        run: |
          python3 -m py_compile server.py
          python3 - <<'EOF'
          import re, pathlib
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          js = pathlib.Path("app.js").read_text(encoding="utf-8")
          html_ids = set(re.findall(r'id="([^"]+)"', html))
          js_ids = set(re.findall(r'getElementById\("([^"]+)"\)', js))
          missing_ids = js_ids - html_ids
          assert not missing_ids, f"Missing DOM IDs: {missing_ids}"
          for asset in ["sprites_sheet1.jpg", "sprites_sheet2.jpg", "sprites_extra.jpg"]:
              assert (pathlib.Path("assets") / asset).exists(), f"Missing asset: {asset}"
          print("All syntax, DOM ID, and asset checks passed.")
          EOF

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage static web files
        run: |
          mkdir -p _site
          cp index.html styles.css experts.js app.js _site/
          cp -r assets _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
